name: lint

on: [push, pull_request]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff==0.16.8
      # E9  = syntax errors, F821 = undefined names.
      # Deliberately narrow: these are always real defects, never style opinions,
      # so the gate stays green without reformatting the existing codebase.
      - name: Check for syntax errors and undefined names
        run: ruff check --isolated --select E9,F821 .
